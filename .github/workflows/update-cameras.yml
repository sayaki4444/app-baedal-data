name: Update cameras.json

on:
  schedule:
    - cron: "0 18 * * 0" # 매주 월요일 03:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build cameras.json
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/build_cameras.py cameras.json

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain cameras.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cameras.json
            git commit -m "Update cameras.json"
            git push
          else
            echo "no changes"
          fi
